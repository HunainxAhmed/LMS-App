services:
  - type: web
    name: campusflow-backend
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: APP_TIMEZONE
        value: Asia/Karachi
      - key: PROJECT_NAME
        value: CampusFlow
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_MASTER_KEY
        value: 4d71597a783856475355644766324b4f536c317646453967483758364d6d673d
